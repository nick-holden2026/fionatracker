<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness & Nutrition Tracker</title>
<style>
  :root{
    --bg:#0f1419; --card:#1a2129; --card2:#212b35; --accent:#4dd4a8; --accent2:#f2a65a;
    --text:#e8edf2; --muted:#8a97a3; --danger:#e8615f; --border:#2a3440;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);padding-bottom:70px;}
  header{padding:16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  header h1{margin:0;font-size:18px;}
  header .sub{color:var(--muted);font-size:12px;margin-top:2px;}
  nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:9;}
  nav button{flex:1;min-width:80px;padding:12px 8px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;border-bottom:2px solid transparent;}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);}
  main{padding:14px;max-width:720px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
  .card h2{margin:0 0 10px;font-size:15px;color:var(--accent);}
  .card h3{margin:12px 0 6px;font-size:13px;color:var(--accent2);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;}
  .totals{font-weight:700;color:var(--accent);}
  .pill{display:inline-block;padding:2px 8px;border-radius:12px;background:var(--card2);font-size:11px;margin-right:4px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input,select,textarea{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:13px;width:100%;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px;margin-top:8px;}
  button.btn{background:var(--accent);color:#08130f;border:none;padding:9px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px;}
  button.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
  button.btn.danger{background:var(--danger);color:#fff;}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .progress-bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:4px;}
  .progress-fill{height:100%;background:var(--accent);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .muted{color:var(--muted);font-size:12px;}
  .day-tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;}
  .day-tabs button{white-space:nowrap;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:12px;}
  .day-tabs button.active{background:var(--accent);color:#08130f;border-color:var(--accent);}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#08130f;padding:12px 20px;border-radius:8px;font-weight:600;display:none;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.4);}
  .checkin{display:flex;gap:6px;}
  .checkin button{flex:1;padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:16px;}
  .checkin button.sel{background:var(--accent2);color:#08130f;border-color:var(--accent2);}
</style>
</head>
<body>

<header>
  <h1>🥗 Nutrition & Fitness Tracker</h1>
  <div class="sub" id="headerSub">Week — · Target: 10kg over 8–10 weeks</div>
</header>

<nav id="tabs">
  <button data-tab="today" class="active">Today</button>
  <button data-tab="planner">Planner</button>
  <button data-tab="workout">Workout</button>
  <button data-tab="sleep">Sleep</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="reminders">Reminders</button>
  <button data-tab="settings">Setup</button>
</nav>

<main id="main"></main>
<div id="toast"></div>

<audio id="buzz" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script>
/* ============ DATA MODEL ============
DB = {
  profile: { heightCm, weightKg, age, sex, activity, startWeight, goalWeight, targetWeeks },
  weeklyPlan: { Mon: {meals:[{time,name,grams,kcal,protein}], workout:{type,notes}}, ... },
  logs: {
    "2026-08-28": {
      meals: [{time,name,grams,kcal,protein,done:bool}],
      workout: {done, type, sets:[{exercise,sets,reps,weight}], caloriesBurned},
      sleep: {bedTime, wakeTime, hours, quality(1-5)},
      checkin: {energy(1-5), notes},
      measurements: {weightKg, waistCm}
    }
  },
  reminders: [{id, time, label, days:[0-6], enabled}]
}
======================================= */

const DB_KEY = 'fitTrackerDB_v1';
let DB = loadDB();

function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw) return JSON.parse(raw);
  return defaultDB();
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

function defaultDB(){
  return {
    profile: { heightCm:160, weightKg:64, age:37, sex:'female', activity:'light',
      startWeight:64, goalWeight:54, targetWeeks:9, startDate: todayStr() },
    weeklyPlan: buildDefaultPlan(),
    logs: {},
    reminders: [
      {id:1, time:'03:15', label:'Wake + seed water', days:[0,1,2,3,4], enabled:true},
      {id:2, time:'04:30', label:'Half salad bowl', days:[0,1,2,3,4], enabled:true},
      {id:3, time:'06:30', label:'Half sprout bowl', days:[0,1,2,3,4], enabled:true},
      {id:4, time:'09:00', label:'3 boiled eggs', days:[0,1,2,3,4], enabled:true},
      {id:5, time:'12:45', label:'Main lunch', days:[0,1,2,3,4], enabled:true},
      {id:6, time:'15:45', label:'Afternoon protein snack', days:[0,1,2,3,4], enabled:true},
      {id:7, time:'17:00', label:'Workout / Physio window', days:[0,1,2,3,4], enabled:true},
      {id:8, time:'19:30', label:'Dinner', days:[0,1,2,3,4], enabled:true},
      {id:9, time:'21:15', label:'Wind down for sleep', days:[0,1,2,3,4], enabled:true},
    ]
  };
}

function buildDefaultPlan(){
  const base = (extras)=>[
    {time:'04:00', name:'Milk tea + ½ khakhra', grams:'1 cup + ½pc', kcal:60, protein:1},
    {time:'04:30', name:'½ Salad bowl', grams:'~100g', kcal:110, protein:5},
    {time:'06:30', name:'½ Sprout bowl', grams:'~90g', kcal:80, protein:6},
    {time:'09:00', name:'3 boiled eggs', grams:'3 whole', kcal:220, protein:18},
    ...extras,
  ];
  return {
    Mon:{meals:base([
      {time:'12:45',name:'Dal-Rice',grams:'1 katori dal + 1 katori rice',kcal:320,protein:14},
      {time:'15:45',name:'Roasted makhana',grams:'20g',kcal:70,protein:2},
      {time:'19:30',name:'Protein bread + egg bhurji',grams:'2 slices + 2 eggs',kcal:380,protein:26},
    ]), workout:{type:'Physio', notes:'Mobility/recovery, light intensity'}},
    Tue:{meals:base([
      {time:'12:45',name:'Protein roti + sabji + curd',grams:'2 roti + 100g sabji + 1 katori curd',kcal:380,protein:24},
      {time:'15:45',name:'Murmura chaat',grams:'25g + veg',kcal:90,protein:3},
      {time:'19:30',name:'Boiled eggs (outside)',grams:'2 whole',kcal:155,protein:12},
    ]), workout:{type:'Gym - Full body strength', notes:'Moderate intensity, 30-40min'}},
    Wed:{meals:base([
      {time:'12:45',name:'Protein oats + milk + chia',grams:'40g oats+150ml milk+1tsp chia',kcal:280,protein:16},
      {time:'15:45',name:'Chaas',grams:'250ml',kcal:40,protein:3},
      {time:'19:30',name:'Paneer salad',grams:'80g paneer + veg',kcal:220,protein:16},
    ]), workout:{type:'Swim', notes:'Cardio, low-impact, 30-40min'}},
    Thu:{meals:base([
      {time:'12:45',name:'Mexican paneer rice',grams:'1 katori rice+60g paneer+veg',kcal:350,protein:18},
      {time:'15:45',name:'Makhana + chaas',grams:'15g + 200ml',kcal:90,protein:4},
      {time:'19:30',name:'Omelette (outside)',grams:'2 eggs',kcal:180,protein:13},
    ]), workout:{type:'Gym - Full body strength', notes:'Moderate intensity, 30-40min'}},
    Fri:{meals:base([
      {time:'12:45',name:'Protein bread + egg bhurji',grams:'2 slices + 2 eggs',kcal:380,protein:26},
      {time:'15:45',name:'Fruit + almonds',grams:'1 fruit + 6 almonds',kcal:130,protein:3},
      {time:'19:30',name:'Moong dal khichdi + curd',grams:'1 katori + 1 katori curd',kcal:300,protein:15},
    ]), workout:{type:'Swim', notes:'Cardio, low-impact, 30-40min'}},
  };
}

function todayStr(d=new Date()){ return d.toISOString().slice(0,10); }
function dayName(d=new Date()){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]; }
function ensureLog(dateStr){
  if(!DB.logs[dateStr]) DB.logs[dateStr] = {meals:[], workout:{done:false}, sleep:{}, checkin:{}, measurements:{}};
  return DB.logs[dateStr];
}

/* ============ NAVIGATION ============ */
let activeTab = 'today';
document.getElementById('tabs').addEventListener('click', e=>{
  if(e.target.tagName==='BUTTON'){
    activeTab = e.target.dataset.tab;
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
    render();
  }
});

function render(){
  const main = document.getElementById('main');
  const wk = weekProgress();
  document.getElementById('headerSub').textContent =
    `Week ${wk.week}/${DB.profile.targetWeeks} · Target: ${DB.profile.startWeight - DB.profile.goalWeight}kg over ${DB.profile.targetWeeks} weeks`;
  if(activeTab==='today') return renderToday(main);
  if(activeTab==='planner') return renderPlanner(main);
  if(activeTab==='workout') return renderWorkout(main);
  if(activeTab==='sleep') return renderSleep(main);
  if(activeTab==='progress') return renderProgress(main);
  if(activeTab==='reminders') return renderReminders(main);
  if(activeTab==='settings') return renderSettings(main);
}

function weekProgress(){
  const start = new Date(DB.profile.startDate);
  const now = new Date();
  const diffDays = Math.max(0, Math.floor((now-start)/86400000));
  return {week: Math.min(DB.profile.targetWeeks, Math.floor(diffDays/7)+1)};
}

/* ============ TODAY TAB ============ */
function renderToday(main){
  const ds = todayStr();
  const dn = dayName();
  const planDay = DB.weeklyPlan[dn] || DB.weeklyPlan.Mon;
  const log = ensureLog(ds);
  if(log.meals.length===0){
    log.meals = planDay.meals.map(m=>({...m, done:false}));
    saveDB();
  }
  let kcalTotal=0, proteinTotal=0, kcalDone=0, proteinDone=0;
  log.meals.forEach(m=>{ kcalTotal+=m.kcal; proteinTotal+=m.protein; if(m.done){kcalDone+=m.kcal; proteinDone+=m.protein;} });

  main.innerHTML = `
    <div class="card">
      <h2>📅 ${dn}, ${ds}</h2>
      <div class="row muted">Plan target: ~1,450 kcal · 90g protein</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,kcalDone/1450*100)}%"></div></div>
      <div class="row" style="margin-top:6px;">
        <span class="pill">🔥 ${kcalDone} / ${kcalTotal} kcal logged</span>
        <span class="pill">💪 ${proteinDone}g / ${proteinTotal}g protein</span>
      </div>
    </div>
    <div class="card">
      <h2>🍽️ Meals</h2>
      ${log.meals.map((m,i)=>`
        <div class="list-item">
          <div>
            <input type="checkbox" ${m.done?'checked':''} onchange="toggleMeal(${i})">
            <b>${m.time}</b> — ${m.name} <span class="muted">(${m.grams})</span>
          </div>
          <div class="muted">${m.kcal}kcal / ${m.protein}g</div>
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>✅ Quick Check-in</h2>
      <label>Energy today</label>
      <div class="checkin">
        ${[1,2,3,4,5].map(n=>`<button class="${log.checkin.energy===n?'sel':''}" onclick="setEnergy(${n})">${n}</button>`).join('')}
      </div>
      <label>Notes</label>
      <textarea rows="2" onchange="setNote(this.value)">${log.checkin.notes||''}</textarea>
    </div>
  `;
}
function toggleMeal(i){ const log = ensureLog(todayStr()); log.meals[i].done = !log.meals[i].done; saveDB(); render(); }
function setEnergy(n){ const log = ensureLog(todayStr()); log.checkin.energy = n; saveDB(); render(); }
function setNote(v){ const log = ensureLog(todayStr()); log.checkin.notes = v; saveDB(); }

/* ============ PLANNER TAB ============ */
let plannerDay = dayName()==='Sat'||dayName()==='Sun' ? 'Mon' : dayName();
function renderPlanner(main){
  const days = ['Mon','Tue','Wed','Thu','Fri'];
  const plan = DB.weeklyPlan[plannerDay];
  let kcalTotal = plan.meals.reduce((s,m)=>s+m.kcal,0);
  let proteinTotal = plan.meals.reduce((s,m)=>s+m.protein,0);
  main.innerHTML = `
    <div class="day-tabs">${days.map(d=>`<button class="${d===plannerDay?'active':''}" onclick="plannerDay='${d}';render()">${d}</button>`).join('')}</div>
    <div class="card">
      <h2>${plannerDay} Meal Plan</h2>
      <table>
        <tr><th>Time</th><th>Meal</th><th>Portion</th><th>Kcal</th><th>Protein</th></tr>
        ${plan.meals.map(m=>`<tr><td>${m.time}</td><td>${m.name}</td><td>${m.grams}</td><td>${m.kcal}</td><td>${m.protein}g</td></tr>`).join('')}
        <tr class="totals"><td colspan="3">Total</td><td>${kcalTotal}</td><td>${proteinTotal}g</td></tr>
      </table>
      <h3>Workout</h3>
      <div class="pill">${plan.workout.type}</div>
      <div class="muted">${plan.workout.notes}</div>
    </div>
    <div class="card muted">Tap a day above to view its plan. Edit meals in Settings → Reset Plan for a fresh template, or check off items daily in the Today tab.</div>
  `;
}

/* ============ WORKOUT TAB ============ */
function renderWorkout(main){
  const ds = todayStr();
  const log = ensureLog(ds);
  const dn = dayName();
  const planned = DB.weeklyPlan[dn]?.workout || {type:'Rest', notes:''};
  main.innerHTML = `
    <div class="card">
      <h2>🏋️ Today's Workout — ${planned.type}</h2>
      <div class="muted">${planned.notes}</div>
      <label>Mark complete</label>
      <input type="checkbox" ${log.workout.done?'checked':''} onchange="toggleWorkoutDone(this.checked)"> Done
      <label>Calories burned (approx)</label>
      <input type="number" value="${log.workout.caloriesBurned||''}" placeholder="e.g. 220" onchange="setWorkoutCals(this.value)">
    </div>
    <div class="card">
      <h2>📆 Month 1 Progressive Program (Weeks 1–4)</h2>
      <h3>Week 1–2: Foundation</h3>
      <table>
        <tr><th>Day</th><th>Focus</th><th>Sets x Reps</th><th>Est. kcal burn</th></tr>
        <tr><td>Tue</td><td>Full body strength (machines/bodyweight)</td><td>3x12, 6 exercises</td><td>150-200</td></tr>
        <tr><td>Wed</td><td>Swim (steady pace)</td><td>25-30 min continuous</td><td>200-250</td></tr>
        <tr><td>Thu</td><td>Full body strength</td><td>3x12, 6 exercises</td><td>150-200</td></tr>
        <tr><td>Fri</td><td>Swim (steady pace)</td><td>25-30 min continuous</td><td>200-250</td></tr>
        <tr><td>Mon</td><td>Physio + light mobility walk</td><td>as prescribed + 15min walk</td><td>60-80</td></tr>
      </table>
      <h3>Week 3–4: Progression</h3>
      <div class="muted">Rule: if all Week 1-2 sets feel "easy" (RPE ≤6/10), progress as below. If not, repeat Week 1-2 loads one more week.</div>
      <table>
        <tr><th>Day</th><th>Change</th></tr>
        <tr><td>Strength days</td><td>3x12 → 3x15, OR add 5-10% weight/resistance</td></tr>
        <tr><td>Swim days</td><td>30min → 35-40min, or add 2x50m faster intervals</td></tr>
        <tr><td>Mon</td><td>Physio continues; add 20min walk if cleared</td></tr>
      </table>
      <h3>Progression rule (Months 2-3)</h3>
      <div class="muted">Every 2 weeks: if energy check-ins average ≥3.5/5 and no joint pain, add ONE of: +1 set, +5-10% load, or +5min cardio. Never increase volume AND intensity in the same week.</div>
    </div>
  `;
}
function toggleWorkoutDone(v){ const log = ensureLog(todayStr()); log.workout.done=v; saveDB(); }
function setWorkoutCals(v){ const log = ensureLog(todayStr()); log.workout.caloriesBurned=Number(v); saveDB(); }

/* ============ SLEEP TAB ============ */
function renderSleep(main){
  const ds = todayStr();
  const log = ensureLog(ds);
  const last7 = getLastNDates(7).map(d=>({date:d, sleep: DB.logs[d]?.sleep||{}}));
  main.innerHTML = `
    <div class="card">
      <h2>😴 Log Tonight's Sleep (for last night, log in morning)</h2>
      <div class="grid2">
        <div><label>Bed time</label><input type="time" value="${log.sleep.bedTime||'21:15'}" onchange="setSleep('bedTime',this.value)"></div>
        <div><label>Wake time</label><input type="time" value="${log.sleep.wakeTime||'03:15'}" onchange="setSleep('wakeTime',this.value)"></div>
      </div>
      <label>Quality (1-5)</label>
      <div class="checkin">${[1,2,3,4,5].map(n=>`<button class="${log.sleep.quality===n?'sel':''}" onclick="setSleep('quality',${n})">${n}</button>`).join('')}</div>
    </div>
    <div class="card">
      <h2>Last 7 Days</h2>
      <table>
        <tr><th>Date</th><th>Bed</th><th>Wake</th><th>Hrs</th><th>Quality</th></tr>
        ${last7.map(r=>{
          const hrs = calcSleepHours(r.sleep.bedTime, r.sleep.wakeTime);
          return `<tr><td>${r.date.slice(5)}</td><td>${r.sleep.bedTime||'-'}</td><td>${r.sleep.wakeTime||'-'}</td><td>${hrs||'-'}</td><td>${r.sleep.quality||'-'}</td></tr>`;
        }).join('')}
      </table>
      <div class="muted" style="margin-top:8px;">Recovery note: your wake time (3:15 AM) means sleep debt shows up fast. If quality is consistently ≤2 or hours &lt;6, treat it as a signal to ease a workout, not push through.</div>
    </div>
  `;
}
function setSleep(field,val){ const log = ensureLog(todayStr()); log.sleep[field]=val; log.sleep.hours = calcSleepHours(log.sleep.bedTime, log.sleep.wakeTime); saveDB(); render(); }
function calcSleepHours(bed,wake){
  if(!bed||!wake) return null;
  let [bh,bm]=bed.split(':').map(Number), [wh,wm]=wake.split(':').map(Number);
  let bedMin=bh*60+bm, wakeMin=wh*60+wm;
  let diff = wakeMin - bedMin; if(diff<0) diff+=1440;
  return (diff/60).toFixed(1);
}
function getLastNDates(n){
  const arr=[]; for(let i=0;i<n;i++){ const d=new Date(); d.setDate(d.getDate()-i); arr.push(todayStr(d)); } return arr;
}

/* ============ PROGRESS TAB ============ */
function renderProgress(main){
  const ds = todayStr();
  const log = ensureLog(ds);
  const allDates = Object.keys(DB.logs).filter(d=>DB.logs[d].measurements?.weightKg).sort();
  const latestW = allDates.length ? DB.logs[allDates[allDates.length-1]].measurements.weightKg : DB.profile.startWeight;
  const lost = (DB.profile.startWeight - latestW).toFixed(1);
  const target = DB.profile.startWeight - DB.profile.goalWeight;
  main.innerHTML = `
    <div class="card">
      <h2>⚖️ Log Today's Measurements</h2>
      <div class="grid2">
        <div><label>Weight (kg)</label><input type="number" step="0.1" value="${log.measurements.weightKg||''}" onchange="setMeasure('weightKg',this.value)"></div>
        <div><label>Waist (cm)</label><input type="number" step="0.1" value="${log.measurements.waistCm||''}" onchange="setMeasure('waistCm',this.value)"></div>
      </div>
      <div class="muted" style="margin-top:6px;">Weigh in max 2x/week, same time, before food. Waist: same tape position weekly.</div>
    </div>
    <div class="card">
      <h2>📊 Progress vs Target</h2>
      <div class="row"><span class="pill">Lost: ${lost}kg</span><span class="pill">Target: ${target}kg</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,(lost/target)*100)}%"></div></div>
      <h3>Milestones</h3>
      <table>
        <tr><th>Milestone</th><th>Target Weight</th><th>Target Week</th></tr>
        <tr><td>Milestone 1</td><td>${(DB.profile.startWeight-3.5).toFixed(1)}kg</td><td>Week 3-4</td></tr>
        <tr><td>Milestone 2</td><td>${(DB.profile.startWeight-6.5).toFixed(1)}kg</td><td>Week 6-7</td></tr>
        <tr><td>Goal</td><td>${DB.profile.goalWeight}kg</td><td>Week 8-10</td></tr>
      </table>
      <h3>If you plateau (no change 2+ weeks)</h3>
      <div class="muted">
        1. Check waist/energy first — scale can lag real progress.<br>
        2. Confirm meals are actually being logged as eaten, not just planned.<br>
        3. Add 1 extra workout day OR trim 100 kcal (never both at once).<br>
        4. If plateau persists 3+ weeks with good adherence, hold calories steady 1 week ("diet break") before adjusting further — this resets hormones/metabolism.
      </div>
    </div>
    <div class="card">
      <h2>Weight Log</h2>
      <table><tr><th>Date</th><th>Weight</th><th>Waist</th></tr>
      ${allDates.slice(-10).reverse().map(d=>`<tr><td>${d}</td><td>${DB.logs[d].measurements.weightKg}kg</td><td>${DB.logs[d].measurements.waistCm||'-'}cm</td></tr>`).join('')}
      </table>
    </div>
  `;
}
function setMeasure(field,val){ const log = ensureLog(todayStr()); log.measurements[field]=Number(val); saveDB(); render(); }

/* ============ REMINDERS TAB ============ */
let notifPermission = 'default';
function renderReminders(main){
  main.innerHTML = `
    <div class="card">
      <h2>🔔 Reminders</h2>
      <div class="muted">Status: ${notifPermission==='granted'?'✅ Browser notifications enabled':'⚠️ Using in-page + sound alerts only'}</div>
      <button class="btn" onclick="requestNotifPermission()">Enable Browser Notifications</button>
      <div class="muted" style="margin-top:6px;">Note: browser notifications only fire while this tab is open (or backgrounded, not fully closed) unless installed as a PWA. Keep this tab open during your routine for reliability, or install to home screen.</div>
    </div>
    <div class="card">
      <h2>Reminder Schedule</h2>
      ${DB.reminders.map(r=>`
        <div class="list-item">
          <div><input type="checkbox" ${r.enabled?'checked':''} onchange="toggleReminder(${r.id})"> <b>${r.time}</b> — ${r.label}</div>
          <button class="btn secondary" onclick="deleteReminder(${r.id})">✕</button>
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>Add Reminder</h2>
      <label>Time</label><input type="time" id="newRemTime">
      <label>Label</label><input type="text" id="newRemLabel" placeholder="e.g. Take vitamins">
      <button class="btn" style="margin-top:10px;" onclick="addReminder()">Add</button>
    </div>
  `;
}
function requestNotifPermission(){
  if(!('Notification' in window)){ showToast('Notifications not supported in this browser — using sound/in-page fallback'); return; }
  Notification.requestPermission().then(p=>{ notifPermission=p; render(); });
}
function toggleReminder(id){ const r=DB.reminders.find(r=>r.id===id); r.enabled=!r.enabled; saveDB(); render(); }
function deleteReminder(id){ DB.reminders = DB.reminders.filter(r=>r.id!==id); saveDB(); render(); }
function addReminder(){
  const time = document.getElementById('newRemTime').value;
  const label = document.getElementById('newRemLabel').value;
  if(!time||!label) return;
  const id = Math.max(0,...DB.reminders.map(r=>r.id))+1;
  DB.reminders.push({id, time, label, days:[0,1,2,3,4], enabled:true});
  saveDB(); render();
}

/* Reminder check loop — fires once per minute, matches HH:MM, dedupes per day */
let firedToday = {};
setInterval(()=>{
  const now = new Date();
  const hhmm = now.toTimeString().slice(0,5);
  const dow = now.getDay();
  const key = todayStr()+hhmm;
  DB.reminders.forEach(r=>{
    if(r.enabled && r.time===hhmm && r.days.includes(dow) && !firedToday[key+r.id]){
      firedToday[key+r.id] = true;
      fireReminder(r.label);
    }
  });
}, 20000); // check every 20s, tolerant of drift

function fireReminder(label){
  showToast('⏰ ' + label);
  try{ document.getElementById('buzz').play(); }catch(e){}
  if(notifPermission==='granted'){
    new Notification('Fitness Tracker', {body: label});
  }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>{ t.style.display='none'; }, 5000);
}

/* ============ SETTINGS TAB ============ */
function renderSettings(main){
  const p = DB.profile;
  main.innerHTML = `
    <div class="card">
      <h2>👤 Your Profile</h2>
      <div class="grid2">
        <div><label>Height (cm)</label><input type="number" value="${p.heightCm}" onchange="setProfile('heightCm',this.value)"></div>
        <div><label>Current Weight (kg)</label><input type="number" step="0.1" value="${p.weightKg}" onchange="setProfile('weightKg',this.value)"></div>
        <div><label>Age</label><input type="number" value="${p.age}" onchange="setProfile('age',this.value)"></div>
        <div><label>Sex</label>
          <select onchange="setProfile('sex',this.value)">
            <option value="female" ${p.sex==='female'?'selected':''}>Female</option>
            <option value="male" ${p.sex==='male'?'selected':''}>Male</option>
          </select>
        </div>
        <div><label>Activity Level</label>
          <select onchange="setProfile('activity',this.value)">
            <option value="sedentary" ${p.activity==='sedentary'?'selected':''}>Sedentary</option>
            <option value="light" ${p.activity==='light'?'selected':''}>Light (this plan)</option>
            <option value="moderate" ${p.activity==='moderate'?'selected':''}>Moderate</option>
          </select>
        </div>
        <div><label>Goal Weight (kg)</label><input type="number" step="0.1" value="${p.goalWeight}" onchange="setProfile('goalWeight',this.value)"></div>
      </div>
      <label>Target duration (weeks)</label>
      <input type="number" value="${p.targetWeeks}" onchange="setProfile('targetWeeks',this.value)">
      <div class="muted" style="margin-top:8px;">Safe rate guide: 0.5-1kg/week. For your profile, 8-10 weeks for 10kg is the safe range — avoid compressing this further.</div>
    </div>
    <div class="card">
      <h2>⚠️ Danger Zone</h2>
      <button class="btn danger" onclick="resetAll()">Reset All Data</button>
      <button class="btn secondary" onclick="exportData()" style="margin-left:8px;">Export JSON Backup</button>
    </div>
  `;
}
function setProfile(field,val){
  DB.profile[field] = (field==='sex'||field==='activity') ? val : Number(val);
  saveDB(); render();
}
function resetAll(){
  if(confirm('This will erase all logged data. Continue?')){
    localStorage.removeItem(DB_KEY);
    DB = loadDB();
    render();
  }
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fitness-tracker-backup.json';
  a.click();
}

/* ============ INIT ============ */
if('Notification' in window) notifPermission = Notification.permission;
render();
</script>
</body>
</html>
