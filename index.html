<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness & Nutrition Tracker</title>
<style>
  :root{
    /* All text/bg pairs below verified >4.5:1 contrast */
    --bg:#0f1419; --card:#1c242d; --card2:#252f3a; --accent:#4ddba8; --accent2:#f5b56b;
    --text:#f2f5f8; --muted:#aeb9c4; --danger:#ff7a78; --border:#37424e;
    --warn:#f5b56b; --ok:#4ddba8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);padding-bottom:70px;}
  a,button,input,select,textarea{font-family:inherit;}
  :focus-visible{outline:3px solid var(--accent2);outline-offset:2px;}
  header{padding:16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  header h1{margin:0;font-size:18px;}
  header .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:9;}
  nav button{flex:1;min-width:80px;padding:14px 8px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;border-bottom:3px solid transparent;min-height:48px;}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}
  main{padding:14px;max-width:720px;margin:0 auto;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .card h2{margin:0 0 12px;font-size:16px;color:var(--accent);}
  .card h3{margin:16px 0 8px;font-size:14px;color:var(--accent2);}

  /* Stacked spacious "record cards" replacing tables */
  .stack{display:flex;flex-direction:column;gap:10px;}
  .rec-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .rec-card .rec-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:14px;}
  .rec-card .rec-sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .rec-card .rec-stats{display:flex;gap:14px;margin-top:8px;font-size:13px;}
  .rec-card .rec-stats b{color:var(--accent);}
  .rec-card.totals{border-color:var(--accent);}
  .rec-card.totals .rec-top{color:var(--accent);}
  .rec-card.upcoming{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2), 0 0 16px rgba(245,181,107,0.35);}
  .rec-card.past{opacity:0.6;}

  .pill{display:inline-block;padding:4px 10px;border-radius:12px;background:var(--card2);font-size:12px;margin-right:6px;border:1px solid var(--border);}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input,select,textarea{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:14px;width:100%;min-height:44px;}
  textarea{min-height:60px;}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;margin-top:10px;font-weight:600;}
  button.btn{background:var(--accent);color:#06120d;border:none;padding:12px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;min-height:48px;}
  button.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
  button.btn.danger{background:var(--danger);color:#2a0605;}

  /* Giant 56px full-width tappable meal row */
  .meal-tap{
    display:flex; align-items:center; gap:14px; width:100%; min-height:56px;
    background:var(--card2); border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; margin-bottom:10px; cursor:pointer; text-align:left;
    color:var(--text); font-size:14px;
  }
  .meal-tap:active{transform:scale(0.99);}
  .meal-tap .box{
    width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);
    flex:0 0 26px; display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .meal-tap.done{border-color:var(--ok);}
  .meal-tap.done .box{background:var(--ok);border-color:var(--ok);color:#06120d;}
  .meal-tap .meal-info{flex:1;}
  .meal-tap .meal-name{font-weight:700;}
  .meal-tap .meal-sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .meal-tap .meal-macros{color:var(--accent);font-size:12.5px;white-space:nowrap;font-weight:600;}
  .meal-tap.upcoming{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2), 0 0 16px rgba(245,181,107,0.35);}
  .meal-tap.past-item{opacity:0.6;}

  .progress-bar{height:12px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:6px;border:1px solid var(--border);}
  .progress-fill{height:100%;transition:width .3s, background-color .3s;}
  .progress-fill.ok{background:var(--ok);}
  .progress-fill.warn{background:var(--warn);}
  .progress-fill.over{background:var(--danger);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .muted{color:var(--muted);font-size:13px;}
  .day-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;}
  .day-tabs button{white-space:nowrap;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:13px;min-height:44px;}
  .day-tabs button.active{background:var(--accent);color:#06120d;border-color:var(--accent);font-weight:700;}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#06120d;padding:14px 22px;border-radius:10px;font-weight:700;display:none;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.4);}
  .checkin{display:flex;gap:8px;}
  .checkin button{flex:1;min-height:48px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:16px;}
  .checkin button.sel{background:var(--accent2);color:#06120d;border-color:var(--accent2);font-weight:700;}
  .list-item{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;gap:8px;}
</style>
</head>
<body>

<header>
  <h1>🥗 Nutrition & Fitness Tracker</h1>
  <div class="sub" id="headerSub">Week — · Target: 10kg over 8–10 weeks</div>
</header>

<nav id="tabs" aria-label="Main sections">
  <button data-tab="tracker" class="active" aria-current="page">Tracker</button>
  <button data-tab="today">Today</button>
  <button data-tab="planner">Planner</button>
  <button data-tab="recipes">Recipes</button>
  <button data-tab="workout">Workout</button>
  <button data-tab="sleep">Sleep</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="reminders">Reminders</button>
  <button data-tab="settings">Setup</button>
</nav>

<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>

<audio id="buzz" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script>
/* ============ DATA MODEL ============
DB = {
  profile: { heightCm, weightKg, age, sex, activity, startWeight, goalWeight, targetWeeks, startDate },
  weeklyPlan: { Mon: {meals:[{time,name,grams,kcal,protein}], workout:{type,notes}}, ... },
  logs: {
    "2026-08-28": {
      meals: [{time,name,grams,kcal,protein,done:bool}],
      workout: {done, type, caloriesBurned},
      sleep: {bedTime, wakeTime, hours, quality(1-5)},
      checkin: {energy(1-5), notes},
      measurements: {weightKg, waistCm}
    }
  },
  reminders: [{id, time, label, days:[0-6], enabled}]
}
======================================= */

const DB_KEY = 'fitTrackerDB_v1';

/* Real per-unit values, derived from YOUR stated data — must be defined BEFORE loadDB() runs,
   since a fresh browser with no saved data calls buildDefaultPlan() -> saladFor() immediately.
   - Protein atta: 46g protein / 100g atta -> 1 roti (~25g atta) = 11.5g protein, ~90kcal
   - Baker's Loaf: 53g protein / 350g loaf, ~7.5 slices -> 1 slice = ~7g protein, ~85kcal
   - Salad half-bowl and sprout-bowl kcal/protein are still ESTIMATES (no label given) */
const SALAD_WEEK1 = ['Mexican Corn','Peanut Punch','Black Chana Chat','Poshan Paneer','Fruity Fun'];
const SALAD_WEEK2 = ['Chatpata Chickpea','Sprouts Protein Salad','Mexican Veg Bowl','Soya Power Bowl','Five Bean Bowl'];
// Toggle this to 2 once week 2 of your subscription starts
const SALAD_ACTIVE_WEEK = 1;
function saladFor(dayIdx){ // 0=Mon..4=Fri
  const list = SALAD_ACTIVE_WEEK===1 ? SALAD_WEEK1 : SALAD_WEEK2;
  return list[dayIdx];
}

let DB = loadDB();

function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){
    const parsed = JSON.parse(raw);
    if(!parsed.customFoods) parsed.customFoods = {}; // migrate older saved data
    return parsed;
  }
  return defaultDB();
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

function defaultDB(){
  return {
    profile: { heightCm:160, weightKg:64, age:37, sex:'female', activity:'light',
      startWeight:64, goalWeight:54, targetWeeks:9, startDate: todayStr() },
    weeklyPlan: buildDefaultPlan(),
    logs: {},
    customFoods: {},
    reminders: [
      {id:1, time:'03:15', label:'Wake + seed water', days:[0,1,2,3,4], enabled:true},
      {id:2, time:'04:30', label:'Half salad bowl', days:[0,1,2,3,4], enabled:true},
      {id:3, time:'06:30', label:'Half sprout bowl', days:[0,1,2,3,4], enabled:true},
      {id:4, time:'09:00', label:'3 boiled eggs', days:[0,1,2,3,4], enabled:true},
      {id:5, time:'12:45', label:'Main lunch', days:[0,1,2,3,4], enabled:true},
      {id:6, time:'15:45', label:'Afternoon protein snack', days:[0,1,2,3,4], enabled:true},
      {id:7, time:'17:00', label:'Workout / Physio window', days:[0,1,2,3,4], enabled:true},
      {id:8, time:'19:30', label:'Dinner', days:[0,1,2,3,4], enabled:true},
      {id:9, time:'21:15', label:'Wind down for sleep', days:[0,1,2,3,4], enabled:true},
    ]
  };
}

function buildDefaultPlan(){
  const base = (dayIdx, extras)=>[
    {time:'04:00', name:'Milk tea + ½ khakhra', grams:'1 cup + ½pc', kcal:60, protein:1},
    {time:'04:30', name:`½ Salad bowl — ${saladFor(dayIdx)} [ESTIMATE]`, grams:'~100g', kcal:110, protein:5},
    {time:'06:30', name:'½ Sprout bowl [ESTIMATE]', grams:'~90g', kcal:80, protein:6},
    {time:'09:00', name:'3 boiled eggs', grams:'3 whole', kcal:220, protein:18},
    ...extras,
  ];
  return {
    Mon:{meals:base(0,[
      {time:'12:45',name:'Dal-Rice',grams:'1 katori dal + 1 katori rice',kcal:320,protein:14},
      {time:'15:45',name:'Roasted makhana',grams:'20g',kcal:70,protein:2},
      // 2 protein rotis (2x90kcal,2x11.5g) + sabji 100g + curd 1 katori
      {time:'19:30',name:'Protein roti (x2) + sabji + curd',grams:'2 roti (~50g atta) + 100g sabji + 1 katori curd',kcal:340,protein:33},
    ]), workout:{type:'Physio', notes:'Mobility/recovery, light intensity'}},
    Tue:{meals:base(1,[
      {time:'12:45',name:'Protein roti (x2) + sabji + curd',grams:'2 roti (~50g atta) + 100g sabji + 1 katori curd',kcal:340,protein:33},
      {time:'15:45',name:'Murmura chaat',grams:'25g + veg',kcal:90,protein:3},
      {time:'19:30',name:'Boiled eggs (outside — plain, no butter)',grams:'2 whole',kcal:155,protein:12},
    ]), workout:{type:'Gym - Full body strength', notes:'Moderate intensity, 30-40min'}},
    Wed:{meals:base(2,[
      {time:'12:45',name:'Protein oats + milk + chia',grams:'40g oats + 150ml milk + 1 tsp chia',kcal:280,protein:16},
      {time:'15:45',name:'Homemade chaas',grams:'250ml',kcal:40,protein:3},
      {time:'19:30',name:'Paneer salad',grams:'80g paneer + veg',kcal:220,protein:16},
    ]), workout:{type:'Swim', notes:'Cardio, low-impact, 30-40min'}},
    Thu:{meals:base(3,[
      {time:'12:45',name:'Mexican paneer rice',grams:'1 katori rice + 60g paneer + veg',kcal:350,protein:18},
      {time:'15:45',name:'Makhana + chaas',grams:'15g + 200ml',kcal:90,protein:4},
      {time:'19:30',name:'Plain omelette (outside)',grams:'2 eggs',kcal:180,protein:13},
    ]), workout:{type:'Gym - Full body strength', notes:'Moderate intensity, 30-40min'}},
    Fri:{meals:base(4,[
      // 2 Baker's Loaf slices (2x85kcal, 2x7g) + 2 egg bhurji
      {time:'12:45',name:"Baker's Loaf (2 slices) + egg bhurji",grams:'2 slices (~90g loaf) + 2 eggs',kcal:280,protein:32},
      {time:'15:45',name:'Fruit + almonds',grams:'1 fruit + 6 almonds',kcal:130,protein:3},
      {time:'19:30',name:'Moong dal khichdi + curd',grams:'1 katori + 1 katori curd',kcal:300,protein:15},
    ]), workout:{type:'Swim', notes:'Cardio, low-impact, 30-40min'}},
  };
}

function todayStr(d=new Date()){ return d.toISOString().slice(0,10); }
function dayName(d=new Date()){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]; }
function ensureLog(dateStr){
  if(!DB.logs[dateStr]) DB.logs[dateStr] = {meals:[], workout:{done:false}, sleep:{}, checkin:{}, measurements:{}, extras:[]};
  if(!DB.logs[dateStr].extras) DB.logs[dateStr].extras = []; // migrate older logs
  return DB.logs[dateStr];
}
function timeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

/* ============ NAVIGATION ============ */
let activeTab = 'tracker';
document.getElementById('tabs').addEventListener('click', e=>{
  if(e.target.tagName==='BUTTON'){
    activeTab = e.target.dataset.tab;
    document.querySelectorAll('#tabs button').forEach(b=>{
      const isActive = b.dataset.tab===activeTab;
      b.classList.toggle('active', isActive);
      if(isActive){ b.setAttribute('aria-current','page'); } else { b.removeAttribute('aria-current'); }
    });
    render();
  }
});

function render(){
  const main = document.getElementById('main');
  const wk = weekProgress();
  document.getElementById('headerSub').textContent =
    `Week ${wk.week}/${DB.profile.targetWeeks} · Target: ${DB.profile.startWeight - DB.profile.goalWeight}kg over ${DB.profile.targetWeeks} weeks`;
  if(activeTab==='today') return renderToday(main);
  if(activeTab==='planner') return renderPlanner(main);
  if(activeTab==='recipes') return renderRecipes(main);
  if(activeTab==='workout') return renderWorkout(main);
  if(activeTab==='sleep') return renderSleep(main);
  if(activeTab==='progress') return renderProgress(main);
  if(activeTab==='tracker') return renderHistory(main);
  if(activeTab==='reminders') return renderReminders(main);
  if(activeTab==='settings') return renderSettings(main);
}

function weekProgress(){
  const start = new Date(DB.profile.startDate);
  const now = new Date();
  const diffDays = Math.max(0, Math.floor((now-start)/86400000));
  return {week: Math.min(DB.profile.targetWeeks, Math.floor(diffDays/7)+1)};
}

function barClass(pct){ return pct>=100 ? 'over' : pct>=80 ? 'warn' : 'ok'; }

/* ============ COMPLETION / ACHIEVEMENTS ============ */
// A day counts as "adhered" if ALL logged meals are checked done AND (if a workout was
// scheduled that day) the workout is marked done. A day with no log yet is not counted.
function dayCompletion(dateStr){
  const log = DB.logs[dateStr];
  if(!log || !log.meals || log.meals.length===0) return null; // no data that day
  const mealsTotal = log.meals.length;
  const mealsDone = log.meals.filter(m=>m.done).length;
  const dow = new Date(dateStr+'T12:00:00').getDay();
  const dn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow];
  const workoutScheduled = !!DB.weeklyPlan[dn];
  const workoutDone = !workoutScheduled || !!log.workout?.done;
  const pct = Math.round(((mealsDone + (workoutDone?1:0)) / (mealsTotal + 1)) * 100);
  const perfect = mealsDone===mealsTotal && workoutDone;
  return {mealsTotal, mealsDone, workoutScheduled, workoutDone, pct, perfect};
}

function currentStreak(){
  let streak = 0;
  let d = new Date();
  // don't break streak just because today isn't finished yet — start checking from yesterday
  // if today isn't a perfect day, but count today if it already is
  const todayC = dayCompletion(todayStr(d));
  if(todayC && todayC.perfect) streak++;
  d.setDate(d.getDate()-1);
  while(true){
    const c = dayCompletion(todayStr(d));
    if(c && c.perfect){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function longestStreak(){
  const dates = Object.keys(DB.logs).sort();
  let longest=0, running=0, prevDate=null;
  dates.forEach(ds=>{
    const c = dayCompletion(ds);
    if(c && c.perfect){
      if(prevDate){
        const gapDays = Math.round((new Date(ds)-new Date(prevDate))/86400000);
        running = gapDays===1 ? running+1 : 1;
      } else { running = 1; }
      longest = Math.max(longest, running);
      prevDate = ds;
    } else {
      running = 0; prevDate = null;
    }
  });
  return longest;
}

function totalPerfectDays(){
  return Object.keys(DB.logs).filter(ds=>{ const c=dayCompletion(ds); return c && c.perfect; }).length;
}

const BADGES = [
  {id:'first', label:'🌱 First Perfect Day', check: t=>t.totalPerfect>=1},
  {id:'streak3', label:'🔥 3-Day Streak', check: t=>t.longest>=3},
  {id:'streak7', label:'🏅 7-Day Streak', check: t=>t.longest>=7},
  {id:'streak14', label:'🏆 14-Day Streak', check: t=>t.longest>=14},
  {id:'total10', label:'💎 10 Perfect Days Total', check: t=>t.totalPerfect>=10},
  {id:'total25', label:'👑 25 Perfect Days Total', check: t=>t.totalPerfect>=25},
];

/* Universal per-100g reference values for common foods, so you can enter EXACT grams and get
   calories/protein auto-calculated instead of guessing. Eggs are "per piece" since that's how
   you actually count them. Extend this list any time you learn an exact label value. */
const FOOD_DB = [
  {name:'Roti (protein atta)', per:'100g', kcal:340, protein:46},
  {name:'Roti (regular atta)', per:'100g', kcal:340, protein:12},
  {name:'Cooked rice', per:'100g', kcal:130, protein:2.7},
  {name:'Cooked dal (moong/toor)', per:'100g', kcal:105, protein:7},
  {name:'Boiled egg', per:'1 piece', kcal:78, protein:6.3},
  {name:'Paneer', per:'100g', kcal:265, protein:18},
  {name:'Curd (plain)', per:'100g', kcal:60, protein:3.5},
  {name:'Milk (full fat)', per:'100ml', kcal:60, protein:3.2},
  {name:"Baker's Loaf protein bread", per:'100g', kcal:265, protein:15},
  {name:'Khakhra', per:'1 piece', kcal:120, protein:3},
  {name:'Roasted makhana', per:'100g', kcal:350, protein:9.7},
  {name:'Roasted peanuts', per:'100g', kcal:570, protein:26},
  {name:'Cooked soya chunks', per:'100g', kcal:135, protein:16.5},
  {name:'Cooked sprouts (mixed)', per:'100g', kcal:90, protein:7},
  {name:'Besan (gram flour, raw)', per:'100g', kcal:387, protein:22},
  {name:'Banana', per:'1 piece', kcal:105, protein:1.3},
  {name:'Almonds', per:'100g', kcal:575, protein:21},
  {name:'Puffed rice (murmura)', per:'100g', kcal:325, protein:7},
];
function foodDbOptions(selectedName){
  return FOOD_DB.map(f=>`<option value="${f.name}" ${f.name===selectedName?'selected':''}>${f.name} (per ${f.per})</option>`).join('');
}
function lookupFood(name){ return FOOD_DB.find(f=>f.name===name); }

/* User's own remembered foods — built automatically every time a manual entry is saved.
   Keyed by lowercase name. Lets "same as before" entries auto-fill without retyping numbers. */
function rememberFood(name, kcal, protein, grams){
  if(!DB.customFoods) DB.customFoods = {};
  DB.customFoods[name.toLowerCase()] = {name, kcal, protein, grams, lastUsed: todayStr(), timesUsed: (DB.customFoods[name.toLowerCase()]?.timesUsed||0)+1};
}
function lookupCustomFood(name){ return DB.customFoods ? DB.customFoods[name.toLowerCase()] : null; }
function recentCustomFoods(n=8){
  if(!DB.customFoods) return [];
  return Object.values(DB.customFoods).sort((a,b)=> b.timesUsed-a.timesUsed || (b.lastUsed>a.lastUsed?1:-1)).slice(0,n);
}

/* ============ TODAY TAB ============ */
let editingMealIdx = null;
function renderToday(main){
  const ds = todayStr();
  const dn = dayName();
  const planDay = DB.weeklyPlan[dn] || DB.weeklyPlan.Mon;
  const log = ensureLog(ds);
  if(log.meals.length===0){
    log.meals = planDay.meals.map(m=>({...m, done:false}));
    saveDB();
  }
  let kcalTotal=0, proteinTotal=0, kcalDone=0, proteinDone=0;
  log.meals.forEach(m=>{ kcalTotal+=m.kcal; proteinTotal+=m.protein; if(m.done){kcalDone+=m.kcal; proteinDone+=m.protein;} });
  // Manual/ad-hoc entries always count as "eaten" the moment they're logged
  log.extras.forEach(e=>{ kcalTotal+=e.kcal; proteinTotal+=e.protein; kcalDone+=e.kcal; proteinDone+=e.protein; });
  const kcalPct = Math.min(140, kcalTotal ? (kcalDone/1450*100) : 0);

  // Determine "next upcoming" meal: first not-done meal whose time hasn't fully passed 90min ago, else first not-done
  const nMin = nowMin();
  let upcomingIdx = log.meals.findIndex(m=>!m.done && timeToMin(m.time) >= nMin - 30);
  if(upcomingIdx === -1) upcomingIdx = log.meals.findIndex(m=>!m.done);

  main.innerHTML = `
    <div class="card">
      <h2>📅 ${dn}, ${ds}</h2>
      <div class="muted">Plan target: ~1,450 kcal · 90g protein</div>
      <div class="progress-bar" role="progressbar" aria-valuenow="${kcalDone}" aria-valuemin="0" aria-valuemax="1450" aria-label="Calories logged today">
        <div class="progress-fill ${barClass(kcalPct)}" style="width:${Math.min(100,kcalPct)}%"></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <span class="pill">🔥 ${kcalDone} / ${kcalTotal} kcal logged</span>

function toggleMeal(i){ const log = ensureLog(todayStr()); log.meals[i].done = !log.meals[i].done; saveDB(); render(); }
function setEnergy(n){ const log = ensureLog(todayStr()); log.checkin.energy = n; saveDB(); render(); }
function setNote(v){ const log = ensureLog(todayStr()); log.checkin.notes = v; saveDB(); }

function startMealEdit(i){ editingMealIdx = i; render(); }
function cancelMealEdit(){ editingMealIdx = null; render(); }

function applyFoodCalc(i){
  const foodName = document.getElementById('editFood'+i).value;
  const qty = Number(document.getElementById('editQty'+i).value);
  if(!foodName){ showToast('⚠️ Choose a food first'); return; }
  if(!qty || qty<=0){ showToast('⚠️ Enter the amount eaten'); return; }
  const food = lookupFood(foodName);
  if(!food) return;

  let kcal, protein, gramsLabel;
  if(food.per === '1 piece'){
    kcal = Math.round(food.kcal * qty);
    protein = Math.round(food.protein * qty * 10)/10;
    gramsLabel = `${qty} pc ${food.name}`;
  } else {
    // per 100g or per 100ml
    kcal = Math.round((food.kcal/100) * qty);
    protein = Math.round((food.protein/100) * qty * 10)/10;
    gramsLabel = `${qty}g ${food.name}`;
  }

  document.getElementById('editKcal'+i).value = kcal;
  document.getElementById('editProtein'+i).value = protein;
  document.getElementById('editGrams'+i).value = gramsLabel;
  showToast('✅ Calculated from exact grams');
}

function saveMealEdit(i){
  const name = document.getElementById('editName'+i).value.trim();
  const time = document.getElementById('editTime'+i).value;
  const grams = document.getElementById('editGrams'+i).value.trim();
  const kcal = Number(document.getElementById('editKcal'+i).value) || 0;
  const protein = Number(document.getElementById('editProtein'+i).value) || 0;
  if(!name){ showToast('⚠️ Food name can\'t be empty'); return; }

  const log = ensureLog(todayStr());
  // Only edits TODAY's log — tomorrow this slot resets back to your saved Planner template
  log.meals[i] = {...log.meals[i], name, time, grams, kcal, protein};
  rememberFood(name, kcal, protein, grams);
  saveDB();
  editingMealIdx = null;
  render();
  showToast('✅ Updated today\'s meal');
}

function tryAutofillFromMemory(){
  const name = document.getElementById('manName').value.trim();
  const remembered = lookupCustomFood(name);
  if(remembered){
    document.getElementById('manKcalTotal').value = remembered.kcal;
    document.getElementById('manProteinTotal').value = remembered.protein;
    showToast(`✅ Filled in from memory: ${remembered.name}`);
  }
}

function quickAddCustomFood(name){
  const f = lookupCustomFood(name);
  if(!f) return;
  const log = ensureLog(todayStr());
  log.extras.push({name: f.name, grams: f.grams, kcal: f.kcal, protein: f.protein, time: new Date().toTimeString().slice(0,5)});
  rememberFood(f.name, f.kcal, f.protein, f.grams); // bump timesUsed / lastUsed
  saveDB();
  render();
  showToast(`✅ Added ${f.name}`);
}

function copyExtrasFromDate(){
  const fromDate = document.getElementById('copyFromDate').value;
  if(!fromDate){ showToast('⚠️ Pick a date to copy from'); return; }
  const sourceLog = DB.logs[fromDate];
  if(!sourceLog || !sourceLog.extras || sourceLog.extras.length===0){ showToast('⚠️ No manual entries logged on that day'); return; }
  const log = ensureLog(todayStr());
  const now = new Date().toTimeString().slice(0,5);
  sourceLog.extras.forEach(e=>{
    log.extras.push({...e, time: now});
    rememberFood(e.name, e.kcal, e.protein, e.grams);
  });
  saveDB();
  render();
  showToast(`✅ Copied ${sourceLog.extras.length} item(s) from ${fromDate}`);
}

function applyManualFoodCalc(){
  const foodName = document.getElementById('manFood').value;
  const qty = Number(document.getElementById('manQty').value);
  if(!foodName){ showToast('⚠️ Choose a food first'); return; }
  if(!qty || qty<=0){ showToast('⚠️ Enter the amount eaten'); return; }
  const food = lookupFood(foodName);
  if(!food) return;

  let kcal, protein;
  if(food.per === '1 piece'){
    kcal = Math.round(food.kcal * qty);
    protein = Math.round(food.protein * qty * 10)/10;
  } else {
    kcal = Math.round((food.kcal/100) * qty);
    protein = Math.round((food.protein/100) * qty * 10)/10;
  }
  document.getElementById('manKcalTotal').value = kcal;
  document.getElementById('manProteinTotal').value = protein;
  if(!document.getElementById('manName').value.trim()) document.getElementById('manName').value = food.name;
  showToast('✅ Calculated from exact grams');
}

function addManualEntry(){
  const name = document.getElementById('manName').value.trim();
  const foodName = document.getElementById('manFood').value;
  const qty = Number(document.getElementById('manQty').value) || null;
  const food = foodName ? lookupFood(foodName) : null;
  const grams = food ? (food.per==='1 piece' ? `${qty} pc ${food.name}` : `${qty}g ${food.name}`) : null;
  const kcalTotal = Number(document.getElementById('manKcalTotal').value) || null;
  const protein = Number(document.getElementById('manProteinTotal').value) || 0;

  if(!name){ showToast('⚠️ Enter a food name'); return; }
  if(!kcalTotal){ showToast('⚠️ Enter total kcal, or use the auto-calculate above'); return; }

  const log = ensureLog(todayStr());
  log.extras.push({name, grams, kcal: kcalTotal, protein, time: new Date().toTimeString().slice(0,5)});
  rememberFood(name, kcalTotal, protein, grams);
  saveDB();
  ['manName','manFood','manQty','manKcalTotal','manProteinTotal'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  render();
}
function deleteManualEntry(i){
  const log = ensureLog(todayStr());
  log.extras.splice(i,1);
  saveDB(); render();
}

      ${days.map(d=>`<button type="button" role="tab" aria-selected="${d===plannerDay}" class="${d===plannerDay?'active':''}" onclick="plannerDay='${d}';render()">${d}</button>`).join('')}
    </div>
    <div class="card">
      <h2>${plannerDay} Meal Plan</h2>
      <div class="stack">
        ${plan.meals.map(m=>`
          <div class="rec-card">
            <div class="rec-top"><span>${m.time} — ${m.name}</span></div>
            <div class="rec-sub">${m.grams}</div>
            <div class="rec-stats"><span><b>${m.kcal}</b> kcal</span><span><b>${m.protein}g</b> protein</span></div>
          </div>`).join('')}
        <div class="rec-card totals">
          <div class="rec-top"><span>Day Total</span></div>
          <div class="rec-stats"><span><b>${kcalTotal}</b> kcal</span><span><b>${proteinTotal}g</b> protein</span></div>
        </div>
      </div>
      <h3>Workout</h3>
      <div class="rec-card">
        <div class="rec-top">${plan.workout.type}</div>
        <div class="rec-sub">${plan.workout.notes}</div>
      </div>
    </div>
    <div class="card muted">Tap a day above to view its plan. Check off items daily in the Today tab.</div>
  `;
}

/* ============ WORKOUT TAB ============ */
function renderWorkout(main){
  const ds = todayStr();
  const log = ensureLog(ds);
  const dn = dayName();
  const planned = DB.weeklyPlan[dn]?.workout || {type:'Rest', notes:''};
  main.innerHTML = `
    <div class="card">
      <h2>🏋️ Today's Workout — ${planned.type}</h2>
      <div class="muted">${planned.notes}</div>
      <button type="button" class="meal-tap ${log.workout.done?'done':''}" style="margin-top:12px;"
        aria-pressed="${log.workout.done}" aria-label="Mark today's workout complete"
        onclick="toggleWorkoutDone(${!log.workout.done})">
        <span class="box" aria-hidden="true">${log.workout.done?'✓':''}</span>
        <span class="meal-info"><span class="meal-name">${log.workout.done?'Workout complete':'Mark workout complete'}</span></span>
      </button>
      <label for="calsBurned">Calories burned (approx)</label>
      <input id="calsBurned" type="number" value="${log.workout.caloriesBurned||''}" placeholder="e.g. 220" onchange="setWorkoutCals(this.value)">
    </div>
    <div class="card">
      <h2>📆 Month 1 Progressive Program (Weeks 1–4)</h2>
      <h3>Week 1–2: Foundation</h3>
      <div class="stack">
        <div class="rec-card"><div class="rec-top">Tue — Full body strength</div><div class="rec-sub">Machines/bodyweight, 3×12, 6 exercises</div><div class="rec-stats"><span>Est. <b>150–200</b> kcal</span></div></div>
        <div class="rec-card"><div class="rec-top">Wed — Swim</div><div class="rec-sub">Steady pace, 25–30 min continuous</div><div class="rec-stats"><span>Est. <b>200–250</b> kcal</span></div></div>
        <div class="rec-card"><div class="rec-top">Thu — Full body strength</div><div class="rec-sub">3×12, 6 exercises</div><div class="rec-stats"><span>Est. <b>150–200</b> kcal</span></div></div>
        <div class="rec-card"><div class="rec-top">Fri — Swim</div><div class="rec-sub">Steady pace, 25–30 min continuous</div><div class="rec-stats"><span>Est. <b>200–250</b> kcal</span></div></div>
        <div class="rec-card"><div class="rec-top">Mon — Physio + light walk</div><div class="rec-sub">As prescribed + 15 min walk</div><div class="rec-stats"><span>Est. <b>60–80</b> kcal</span></div></div>
      </div>
      <h3>Week 3–4: Progression</h3>
      <div class="muted">Rule: if all Week 1–2 sets feel "easy" (RPE ≤6/10), progress as below. If not, repeat Week 1–2 loads one more week.</div>
      <div class="stack" style="margin-top:8px;">
        <div class="rec-card"><div class="rec-top">Strength days</div><div class="rec-sub">3×12 → 3×15, OR add 5–10% weight/resistance</div></div>
        <div class="rec-card"><div class="rec-top">Swim days</div><div class="rec-sub">30 min → 35–40 min, or add 2×50m faster intervals</div></div>
        <div class="rec-card"><div class="rec-top">Monday</div><div class="rec-sub">Physio continues; add 20 min walk if cleared</div></div>
      </div>
      <h3>Progression rule (Months 2–3)</h3>
      <div class="muted">Every 2 weeks: if energy check-ins average ≥3.5/5 and no joint pain, add ONE of: +1 set, +5–10% load, or +5 min cardio. Never increase volume AND intensity in the same week.</div>
    </div>
  `;
}
function toggleWorkoutDone(v){ const log = ensureLog(todayStr()); log.workout.done=v; saveDB(); render(); }
function setWorkoutCals(v){ const log = ensureLog(todayStr()); log.workout.caloriesBurned=Number(v); saveDB(); }

/* ============ SLEEP TAB ============ */
function renderSleep(main){
  const ds = todayStr();
  const log = ensureLog(ds);
  const last7 = getLastNDates(7).map(d=>({date:d, sleep: DB.logs[d]?.sleep||{}}));
  main.innerHTML = `
    <div class="card">
      <h2>😴 Log Tonight's Sleep (log in the morning, for last night)</h2>
      <div class="grid2">
        <div><label for="bedTime">Bed time</label><input id="bedTime" type="time" value="${log.sleep.bedTime||'21:15'}" onchange="setSleep('bedTime',this.value)"></div>
        <div><label for="wakeTime">Wake time</label><input id="wakeTime" type="time" value="${log.sleep.wakeTime||'03:15'}" onchange="setSleep('wakeTime',this.value)"></div>
      </div>
      <label id="qualLabel">Quality (1–5)</label>
      <div class="checkin" role="group" aria-labelledby="qualLabel">
        ${[1,2,3,4,5].map(n=>`<button type="button" class="${log.sleep.quality===n?'sel':''}" aria-pressed="${log.sleep.quality===n}" aria-label="Sleep quality ${n} of 5" onclick="setSleep('quality',${n})">${n}</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Last 7 Days</h2>
      <div class="stack">
        ${last7.map(r=>{
          const hrs = calcSleepHours(r.sleep.bedTime, r.sleep.wakeTime);
          return `<div class="rec-card">
            <div class="rec-top"><span>${r.date}</span></div>
            <div class="rec-stats">
              <span>Bed <b>${r.sleep.bedTime||'—'}</b></span>
              <span>Wake <b>${r.sleep.wakeTime||'—'}</b></span>
              <span><b>${hrs||'—'}</b> hrs</span>
              <span>Quality <b>${r.sleep.quality||'—'}</b></span>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="muted" style="margin-top:10px;">Recovery note: your wake time (3:15 AM) means sleep debt shows up fast. If quality is consistently ≤2 or hours &lt;6, treat it as a signal to ease a workout, not push through.</div>
    </div>
  `;
}
function setSleep(field,val){ const log = ensureLog(todayStr()); log.sleep[field]=val; log.sleep.hours = calcSleepHours(log.sleep.bedTime, log.sleep.wakeTime); saveDB(); render(); }
function calcSleepHours(bed,wake){
  if(!bed||!wake) return null;
  let [bh,bm]=bed.split(':').map(Number), [wh,wm]=wake.split(':').map(Number);
  let bedMin=bh*60+bm, wakeMin=wh*60+wm;
  let diff = wakeMin - bedMin; if(diff<0) diff+=1440;
  return (diff/60).toFixed(1);
}
function getLastNDates(n){
  const arr=[]; for(let i=0;i<n;i++){ const d=new Date(); d.setDate(d.getDate()-i); arr.push(todayStr(d)); } return arr;
}

/* ============ PROGRESS TAB ============ */
function renderProgress(main){
  const ds = todayStr();
  const log = ensureLog(ds);
  const allDates = Object.keys(DB.logs).filter(d=>DB.logs[d].measurements?.weightKg).sort();
  const latestW = allDates.length ? DB.logs[allDates[allDates.length-1]].measurements.weightKg : DB.profile.startWeight;
  const lost = (DB.profile.startWeight - latestW).toFixed(1);
  const target = DB.profile.startWeight - DB.profile.goalWeight;
  const pct = Math.min(100,(lost/target)*100);
  main.innerHTML = `
    <div class="card">
      <h2>⚖️ Log Today's Measurements</h2>
      <div class="grid2">
        <div><label for="wKg">Weight (kg)</label><input id="wKg" type="number" step="0.1" value="${log.measurements.weightKg||''}" onchange="setMeasure('weightKg',this.value)"></div>
        <div><label for="wCm">Waist (cm)</label><input id="wCm" type="number" step="0.1" value="${log.measurements.waistCm||''}" onchange="setMeasure('waistCm',this.value)"></div>
      </div>
      <div class="muted" style="margin-top:8px;">Weigh in max 2x/week, same time, before food. Waist: same tape position weekly.</div>
    </div>
    <div class="card">
      <h2>📊 Progress vs Target</h2>
      <div class="row"><span class="pill">Lost: ${lost}kg</span><span class="pill">Target: ${target}kg</span></div>
      <div class="progress-bar" role="progressbar" aria-valuenow="${lost}" aria-valuemin="0" aria-valuemax="${target}" aria-label="Weight lost vs target">
        <div class="progress-fill ok" style="width:${pct}%"></div>
      </div>
      <h3>Milestones</h3>
      <div class="stack">
        <div class="rec-card"><div class="rec-top">Milestone 1</div><div class="rec-stats"><span><b>${(DB.profile.startWeight-3.5).toFixed(1)}kg</b></span><span>Week 3–4</span></div></div>
        <div class="rec-card"><div class="rec-top">Milestone 2</div><div class="rec-stats"><span><b>${(DB.profile.startWeight-6.5).toFixed(1)}kg</b></span><span>Week 6–7</span></div></div>
        <div class="rec-card"><div class="rec-top">Goal</div><div class="rec-stats"><span><b>${DB.profile.goalWeight}kg</b></span><span>Week 8–10</span></div></div>
      </div>
      <h3>If you plateau (no change 2+ weeks)</h3>
      <div class="muted">
        1. Check waist/energy first — scale can lag real progress.<br>
        2. Confirm meals are actually being logged as eaten, not just planned.<br>
        3. Add 1 extra workout day OR trim 100 kcal (never both at once).<br>
        4. If plateau persists 3+ weeks with good adherence, hold calories steady 1 week ("diet break") before adjusting further — this resets hormones/metabolism.
      </div>
    </div>
    <div class="card">
      <h2>Weight Log</h2>
      <div class="stack">
        ${allDates.slice(-10).reverse().map(d=>`
          <div class="rec-card">
            <div class="rec-top"><span>${d}</span></div>
            <div class="rec-stats"><span><b>${DB.logs[d].measurements.weightKg}kg</b></span><span>Waist <b>${DB.logs[d].measurements.waistCm||'—'}cm</b></span></div>
          </div>`).join('') || '<div class="muted">No entries yet.</div>'}
      </div>
    </div>
  `;
}
function setMeasure(field,val){ const log = ensureLog(todayStr()); log.measurements[field]=Number(val); saveDB(); render(); }

/* ============ REMINDERS TAB ============ */
let notifPermission = 'default';
function renderReminders(main){
  main.innerHTML = `
    <div class="card">
      <h2>🔔 Reminders</h2>
      <div class="muted">Status: ${notifPermission==='granted'?'✅ Browser notifications enabled':'⚠️ Using in-page + sound alerts only'}</div>
      <button type="button" class="btn" style="margin-top:10px;" onclick="requestNotifPermission()">Enable Browser Notifications</button>
      <div class="muted" style="margin-top:8px;">Note: browser notifications only fire while this tab is open (or backgrounded, not fully closed) unless installed as a PWA. Keep this tab open during your routine for reliability, or install to home screen.</div>
    </div>
    <div class="card">
      <h2>Reminder Schedule</h2>
      <div class="stack">
        ${DB.reminders.map(r=>`
          <div class="rec-card row" style="justify-content:space-between;">
            <button type="button" class="meal-tap ${r.enabled?'done':''}" style="margin:0;flex:1;"
              aria-pressed="${r.enabled}" aria-label="${r.label} at ${r.time}, ${r.enabled?'enabled':'disabled'}"
              onclick="toggleReminder(${r.id})">
              <span class="box" aria-hidden="true">${r.enabled?'✓':''}</span>
              <span class="meal-info"><span class="meal-name">${r.time} — ${r.label}</span></span>
            </button>
            <button type="button" class="btn danger" aria-label="Delete reminder: ${r.label}" onclick="deleteReminder(${r.id})">✕</button>
          </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Add Reminder</h2>
      <label for="newRemTime">Time</label><input id="newRemTime" type="time">
      <label for="newRemLabel">Label</label><input id="newRemLabel" type="text" placeholder="e.g. Take vitamins">
      <button type="button" class="btn" style="margin-top:10px;" onclick="addReminder()">Add</button>
    </div>
  `;
}
function requestNotifPermission(){
  if(!('Notification' in window)){ showToast('Notifications not supported in this browser — using sound/in-page fallback'); return; }
  Notification.requestPermission().then(p=>{ notifPermission=p; render(); });
}
function toggleReminder(id){ const r=DB.reminders.find(r=>r.id===id); r.enabled=!r.enabled; saveDB(); render(); }
function deleteReminder(id){ DB.reminders = DB.reminders.filter(r=>r.id!==id); saveDB(); render(); }
function addReminder(){
  const time = document.getElementById('newRemTime').value;
  const label = document.getElementById('newRemLabel').value;
  if(!time||!label) return;
  const id = Math.max(0,...DB.reminders.map(r=>r.id))+1;
  DB.reminders.push({id, time, label, days:[0,1,2,3,4], enabled:true});
  saveDB(); render();
}

/* Reminder check loop — fires once per ~20s, matches HH:MM, dedupes per day */
let firedToday = {};
setInterval(()=>{
  const now = new Date();
  const hhmm = now.toTimeString().slice(0,5);
  const dow = now.getDay();
  const key = todayStr()+hhmm;
  DB.reminders.forEach(r=>{
    if(r.enabled && r.time===hhmm && r.days.includes(dow) && !firedToday[key+r.id]){
      firedToday[key+r.id] = true;
      fireReminder(r.label);
    }
  });
}, 20000);

function fireReminder(label){
  showToast('⏰ ' + label);
  try{ document.getElementById('buzz').play(); }catch(e){}
  if(notifPermission==='granted'){
    new Notification('Fitness Tracker', {body: label});
  }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>{ t.style.display='none'; }, 5000);
}

/* ============ SETTINGS TAB ============ */
function renderSettings(main){
  const p = DB.profile;
  main.innerHTML = `
    <div class="card">
      <h2>👤 Your Profile</h2>
      <div class="grid2">
        <div><label for="pHeight">Height (cm)</label><input id="pHeight" type="number" value="${p.heightCm}" onchange="setProfile('heightCm',this.value)"></div>
        <div><label for="pWeight">Current Weight (kg)</label><input id="pWeight" type="number" step="0.1" value="${p.weightKg}" onchange="setProfile('weightKg',this.value)"></div>
        <div><label for="pAge">Age</label><input id="pAge" type="number" value="${p.age}" onchange="setProfile('age',this.value)"></div>
        <div><label for="pSex">Sex</label>
          <select id="pSex" onchange="setProfile('sex',this.value)">
            <option value="female" ${p.sex==='female'?'selected':''}>Female</option>
            <option value="male" ${p.sex==='male'?'selected':''}>Male</option>
          </select>
        </div>
        <div><label for="pActivity">Activity Level</label>
          <select id="pActivity" onchange="setProfile('activity',this.value)">
            <option value="sedentary" ${p.activity==='sedentary'?'selected':''}>Sedentary</option>
            <option value="light" ${p.activity==='light'?'selected':''}>Light (this plan)</option>
            <option value="moderate" ${p.activity==='moderate'?'selected':''}>Moderate</option>
          </select>
        </div>
        <div><label for="pGoal">Goal Weight (kg)</label><input id="pGoal" type="number" step="0.1" value="${p.goalWeight}" onchange="setProfile('goalWeight',this.value)"></div>
      </div>
      <label for="pWeeks">Target duration (weeks)</label>
      <input id="pWeeks" type="number" value="${p.targetWeeks}" onchange="setProfile('targetWeeks',this.value)">
      <div class="muted" style="margin-top:10px;">Safe rate guide: 0.5–1kg/week. For your profile, 8–10 weeks for 10kg is the safe range — avoid compressing this further.</div>
    </div>
    <div class="card">
      <h2>⚠️ Danger Zone</h2>
      <div class="row">
        <button type="button" class="btn danger" onclick="resetAll()">Reset All Data</button>
        <button type="button" class="btn secondary" onclick="exportData()">Export JSON Backup</button>
      </div>
    </div>
  `;
}
function setProfile(field,val){
  DB.profile[field] = (field==='sex'||field==='activity') ? val : Number(val);
  saveDB(); render();
}
function resetAll(){
  if(confirm('This will erase all logged data. Continue?')){
    localStorage.removeItem(DB_KEY);
    DB = loadDB();
    render();
  }
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fitness-tracker-backup.json';
  a.click();
}

/* ============ INIT ============ */
if('Notification' in window) notifPermission = Notification.permission;
render();
</script>
